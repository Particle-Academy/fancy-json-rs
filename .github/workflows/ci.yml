name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Test (release)
        # The deep-nesting tests are the ones that behave differently with
        # optimisation on: a smaller stack frame moves where a recursive
        # implementation would have died, so the release run is the honest one.
        run: cargo test --release --all-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Build for a target with no std at all
        # `--no-default-features` on a host target proves the cfgs line up; a
        # bare-metal target proves there is no accidental `std` in the tree,
        # which is the claim the README actually makes.
        run: cargo build --no-default-features --target thumbv7em-none-eabi

  determinism-hazards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The determinism guarantee rests on constructs this crate must NEVER
      # contain. Tests can measure the output; only a gate can stop the cause
      # being reintroduced -- and `HashMap` is the one that matters most,
      # because its per-process randomised iteration order would make key order
      # differ between two runs of the SAME binary, which no golden would catch
      # reliably.
      - name: Forbidden constructs must not appear in src/
        run: |
          fail=0
          check() {
            if grep -rn "$1" src/ ; then
              echo "^^ '$1' is forbidden in src/: $2"
              fail=1
            fi
          }
          check "HashMap"      "randomised iteration order -- use BTreeMap or the ordered Map"
          check "HashSet"      "randomised iteration order"
          check "RandomState"  "randomised hashing"
          check "to_ne_bytes"  "native endianness reaches the output"
          check "from_ne_bytes" "native endianness reaches the output"
          check "SystemTime"   "a wall clock is not deterministic"
          check "Instant"      "a wall clock is not deterministic"
          check "to_lowercase(" "locale/Unicode-version dependent -- use to_ascii_lowercase"
          check "to_uppercase(" "locale/Unicode-version dependent -- use to_ascii_uppercase"
          if [ "$fail" -ne 0 ]; then
            echo
            echo "See AGENTS.md, 'Byte-determinism'. A consensus consumer treats a"
            echo "rendering divergence as a chain halt, not a bug."
            exit 1
          fi
          echo "src/ is free of every construct that could make output vary by run or target."

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: The dependency tree must stay empty
        # The crate's headline claim, asserted rather than stated. A dependency
        # added without the owner's approval fails the build here — which is the
        # whole point, since nothing else would notice one appear.
        run: |
          tree=$(cargo tree --edges normal --prefix none --all-features | grep -v '^fancy-json' | grep -v '^$' || true)
          if [ -n "$tree" ]; then
            echo "fancy-json has grown dependencies:"
            echo "$tree"
            echo
            echo "Third-party code needs the owner's approval. See the envelope AGENTS.md."
            exit 1
          fi
          echo "cargo tree is one line. Good."
